name: Uppdatera priser

# Hämtar priser för alla kort en gång per dygn (gratis källor: pokemontcg.io och TCGCSV) och sparar dem på grenen "prices".
# Appen läser latest.json därifrån, och hist/<set>.json ger prisdiagram dag för dag. Grenen skrivs om varje gång (ingen växande historik i git).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hämta tidigare prishistorik
        run: |
          mkdir -p pb
          if git fetch --depth 1 origin prices; then git archive FETCH_HEAD | tar -x -C pb; else echo "Ingen tidigare historik"; fi
      - name: Hämta dagens priser
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: node tools/build-prices.mjs pb
      - name: Publicera på grenen prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pb
          printf '# Priser för KortKoll\n\nUppdateras automatiskt varje dygn av arbetsflödet "Uppdatera priser". Ändra inte för hand.\n' > README.md
          git init -q -b prices
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Priser $(date -u +%F)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" prices
          du -sh .
