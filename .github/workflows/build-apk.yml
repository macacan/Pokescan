name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v5

      - id: node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (förinstallerad)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME" && echo "sdk.dir=$ANDROID_HOME" > /tmp/local.properties

      - id: build
        name: Bygg APK (loggas till build.log)
        shell: bash
        run: |
          set -o pipefail
          log() { echo "::group::$1"; echo "===== $1 =====" >> build.log; }
          run() { "$@" 2>&1 | tee -a build.log; }
          log "npm install";        run npm install --no-audit --no-fund
          log "cap add android";    run npx cap add android
          log "kamerabehörighet"
          cp /tmp/local.properties android/local.properties
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -q 'android.permission.CAMERA' $M
          run cat $M
          log "ikoner";             run npm run icons || echo "ikoner hoppades över" | tee -a build.log
          log "cap sync";           run npx cap sync android
          log "gradle";             cd android && chmod +x gradlew && run ./gradlew assembleDebug --no-daemon --stacktrace; cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk PokeScan.apk
          echo "APK OK: $(du -h PokeScan.apk | cut -f1)" | tee -a build.log

      - name: Spara APK som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PokeScan-apk
          path: PokeScan.apk

      - id: release
        name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PokéScan 1.0.${{ github.run_number }}
          body: Ladda ner PokeScan.apk nedan och öppna den på din Android-telefon.
          files: PokeScan.apk

      - name: Skicka byggstatus till grenen build-status
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/st && cp build.log /tmp/st/ 2>/dev/null || echo "ingen logg" > /tmp/st/build.log
          tail -c 60000 /tmp/st/build.log > /tmp/st/tail.log
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }} checkout=${{ steps.checkout.outcome }} node=${{ steps.node.outcome }} java=${{ steps.java.outcome }} build=${{ steps.build.outcome }} release=${{ steps.release.outcome }}" > /tmp/st/status.txt
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan build-status
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/st/tail.log build.log; cp /tmp/st/status.txt status.txt
          git add build.log status.txt && git commit -qm "Byggstatus ${{ github.run_number }}: ${{ job.status }}"
          git push -f origin build-status
