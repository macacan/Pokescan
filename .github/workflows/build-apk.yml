name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Installera Capacitor
        run: npm install

      - name: Skapa Android-projekt
        run: npx cap add android

      - name: Kamerabehörighet
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -q 'android.permission.CAMERA' $M
          cat $M

      - name: Appikoner
        run: npm run icons || echo "Ikoner hoppades över"

      - name: Synka webbfiler
        run: npx cap sync android

      - name: Bygg APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PokeScan.apk

      - name: Spara APK som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PokeScan-apk
          path: PokeScan.apk

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PokéScan 1.0.${{ github.run_number }}
          body: Ladda ner PokeScan.apk nedan och öppna den på din Android-telefon.
          files: PokeScan.apk
